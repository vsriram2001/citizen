<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Share Card Concepts</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
<!--
  Three directions for the "Here's what I voted for" share card, mocked at the
  shared image's shape (1080×1920, shown at 1/3). Static sketches to react to;
  whichever is picked becomes both the on-page card and
  src/app/share/votes/image/route.tsx. Colours are the tokens in globals.css.
-->
<style>
  :root {
    --ink: #1a1a18; --paper: #fafaf7; --card: #ffffff; --border: #d9d7cf;
    --headline: #33322e; --muted: #6f6f68; --secondary: #5a5a54;
    --brand: #0248a6; --navy: #0f1e2c; --accent: #2f4858;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: #ecebe6; color: var(--headline); font: 14px/1.4 "Public Sans", system-ui, sans-serif; padding: 32px 16px 64px; }
  h1.page { font: 900 28px/1.1 "Playfair Display", serif; text-align: center; }
  p.lede { text-align: center; color: var(--secondary); margin: 8px auto 28px; max-width: 560px; }
  .row { display: flex; flex-wrap: wrap; gap: 28px; justify-content: center; }
  figure { display: flex; flex-direction: column; gap: 12px; width: 360px; max-width: 100%; }
  figcaption b { display: block; font-size: 15px; color: var(--headline); }
  figcaption { color: var(--secondary); font-size: 13px; }
  .frame { width: 360px; height: 640px; max-width: 100%; position: relative; overflow: hidden; border-radius: 6px; box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.08); }
  .serif { font-family: "Playfair Display", serif; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
  .delta { display: inline-flex; align-items: baseline; gap: 6px; font-variant-numeric: tabular-nums; }
  .delta .from { color: var(--muted); text-decoration: line-through; text-decoration-color: rgba(0,0,0,.25); }
  .delta .to { color: var(--brand); font-weight: 700; }

  /* ── A · Inked ───────────────────────────────────────── */
  .a { background: var(--paper); padding: 34px 28px 26px; display: flex; flex-direction: column; }
  .a .mark { width: 74px; align-self: center; margin-top: 6px; }
  .a .kicker { text-align: center; font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin-top: 18px; }
  .a h2 { font: 900 34px/1.02 "Playfair Display", serif; text-align: center; letter-spacing: -.02em; margin-top: 6px; color: var(--ink); }
  .a ol { list-style: none; padding: 0; margin-top: 26px; display: flex; flex-direction: column; gap: 14px; }
  .a li { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 13px 14px 12px; display: grid; grid-template-columns: 22px 1fr; gap: 2px 10px; }
  .a li .n { font: 900 18px/1 "Playfair Display", serif; color: var(--muted); padding-top: 1px; }
  .a li .t { font-weight: 600; font-size: 13.5px; line-height: 1.3; color: var(--ink); }
  .a li .d { grid-column: 2; font-size: 12.5px; margin-top: 4px; }
  .a .line { margin-top: auto; text-align: center; font: italic 700 15px/1.35 "Playfair Display", serif; color: var(--secondary); }
  .a .line b { color: var(--ink); display: block; }
  .a .foot { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-size: 10.5px; color: var(--muted); }
  .a .foot .mono { color: var(--headline); font-size: 10.5px; }

  /* ── B · Ballot ticket ───────────────────────────────── */
  .b { background: var(--navy); padding: 26px 20px; display: flex; }
  .b .ticket { background: var(--paper); border-radius: 6px; flex: 1; display: flex; flex-direction: column; position: relative; overflow: hidden; }
  .b .top { padding: 22px 20px 16px; display: flex; justify-content: space-between; align-items: flex-start; }
  .b .brand { display: flex; align-items: center; gap: 7px; font-weight: 700; font-size: 13px; color: var(--ink); }
  .b .brand svg { height: 18px; width: auto; }
  .b .year { text-align: right; }
  .b .year small { display: block; font-size: 9px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
  .b .year span { font: 900 30px/1 "Playfair Display", serif; color: var(--ink); }
  .b h2 { padding: 0 20px; font: 900 27px/1.05 "Playfair Display", serif; letter-spacing: -.015em; color: var(--ink); }
  .b .perf { position: relative; height: 22px; margin: 14px 0; }
  .b .perf::before { content: ""; position: absolute; left: 14px; right: 14px; top: 50%; border-top: 2px dashed var(--border); }
  .b .perf::after, .b .perf i { content: ""; position: absolute; top: 0; width: 22px; height: 22px; border-radius: 50%; background: var(--navy); }
  .b .perf::after { right: -11px; } .b .perf i { left: -11px; }
  .b ol { list-style: none; padding: 0 20px; display: flex; flex-direction: column; gap: 14px; }
  .b li { display: grid; grid-template-columns: 26px 1fr; gap: 3px 8px; }
  .b li .box { width: 18px; height: 18px; border: 2px solid var(--ink); border-radius: 3px; display: grid; place-items: center; margin-top: 1px; }
  .b li .box svg { width: 12px; }
  .b li .t { font-weight: 600; font-size: 13.5px; line-height: 1.3; color: var(--ink); }
  .b li .d { grid-column: 2; font-size: 12.5px; }
  .b .stub { margin-top: auto; padding: 0 20px 20px; }
  .b .stub small { font-size: 9px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
  .b .stub .mono { font-size: 12px; font-weight: 600; color: var(--ink); margin-top: 2px; }
  .b .bars { display: flex; gap: 2px; height: 34px; margin-top: 10px; align-items: stretch; }
  .b .bars i { background: var(--ink); }
  .b .url { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--muted); margin-top: 8px; }

  /* ── C · Poster ──────────────────────────────────────── */
  .c { background: var(--paper); padding: 30px 26px 24px; display: flex; flex-direction: column; position: relative; }
  .c .art { position: absolute; right: -112px; bottom: -150px; width: 290px; }
  .c .kicker { display: flex; align-items: center; gap: 7px; font-weight: 700; font-size: 12.5px; color: var(--ink); }
  .c .kicker svg { height: 16px; width: auto; }
  .c h2 { font: 900 44px/.98 "Playfair Display", serif; letter-spacing: -.025em; color: var(--ink); margin-top: 26px; }
  .c h2 em { font-style: italic; color: var(--brand); }
  .c ol { list-style: none; padding: 0; margin-top: 24px; display: flex; flex-direction: column; gap: 16px; max-width: 214px; position: relative; }
  .c li .n { font: 700 11px/1 "Public Sans"; letter-spacing: .14em; color: var(--muted); }
  .c li .t { font-weight: 600; font-size: 14px; line-height: 1.28; color: var(--ink); margin-top: 4px; }
  .c li .d { font-size: 12.5px; margin-top: 3px; }
  .c .foot { margin-top: auto; position: relative; font-size: 10.5px; color: var(--muted); max-width: 190px; }
  .c .foot .mono { color: var(--headline); display: block; margin-top: 2px; }
  .c .foot .line { font: italic 700 13px/1.3 "Playfair Display", serif; color: var(--secondary); margin-bottom: 10px; }
</style>
</head>
<body>
  <h1 class="page">Share card · three directions</h1>
  <p class="lede">Shown at a third of the real 1080×1920 image. Same three asks in each. The blue figures are each ask's current value → target, the thing that makes these asks different from a slogan.</p>

  <div class="row">
    <!-- A -->
    <figure>
      <div class="frame a">
        <svg class="mark" viewBox="54.5 37 234.5 299" fill="none"><path d="M68.5 336V180C68.5 116 114 51 171.75 51C229.5 51 275 116 275 180V336" stroke="#1a1a18" stroke-width="28"/><path d="M132 66C112 88 105.5 104 105.5 124V202C105.5 233 135.2 257 171.75 257C208.3 257 238 233 238 202V124C238 104 231.5 88 211.5 66" stroke="#1a1a18" stroke-width="17.5"/><path d="M171.75 202.5V278.75" stroke="#0248a6" stroke-width="35" stroke-linecap="round"/></svg>
        <div class="kicker">Citizen Poll · My ballot 2026</div>
        <h2>Here's what<br />I voted for</h2>
        <ol class="asks"></ol>
        <p class="line">The ink fades.<b>The record doesn't.</b></p>
        <div class="foot"><span class="mono">CP26-QR7KM-ZK5JQ-RVQ43-H8MK1</span><span>citizenpoll.in</span></div>
      </div>
      <figcaption><b>A · Inked</b>The animation's last frame becomes the top of the card: the inked logo, then the three asks as cards, then the line. Calm, closest to what you have, and it makes the card and the animation one story.</figcaption>
    </figure>

    <!-- B -->
    <figure>
      <div class="frame b">
        <div class="ticket">
          <div class="top">
            <div class="brand"><svg viewBox="54.5 37 234.5 299" fill="none"><path d="M68.5 336V180C68.5 116 114 51 171.75 51C229.5 51 275 116 275 180V336" stroke="#1a1a18" stroke-width="28"/><path d="M132 66C112 88 105.5 104 105.5 124V202C105.5 233 135.2 257 171.75 257C208.3 257 238 233 238 202V124C238 104 231.5 88 211.5 66" stroke="#1a1a18" stroke-width="17.5"/><path d="M171.75 202.5V278.75" stroke="#0248a6" stroke-width="35" stroke-linecap="round"/></svg>Citizen Poll</div>
            <div class="year"><small>Ballot</small><span>2026</span></div>
          </div>
          <h2>I used my three votes on these.</h2>
          <div class="perf"><i></i></div>
          <ol class="asks"></ol>
          <div class="perf"><i></i></div>
          <div class="stub">
            <small>Ballot ID</small>
            <div class="mono">CP26-QR7KM-ZK5JQ-RVQ43-H8MK1</div>
            <div class="bars"></div>
            <div class="url"><span>Check it at citizenpoll.in/verify</span><span>3 of 3 votes</span></div>
          </div>
        </div>
      </div>
      <figcaption><b>B · Ballot ticket</b>A modern stub, like a boarding pass: notched tear lines, ticked boxes, and a barcode drawn from the Ballot ID. It leans into "only 3 votes a year", and the ticket shape stands out in a feed.</figcaption>
    </figure>

    <!-- C -->
    <figure>
      <div class="frame c">
        <svg class="art" viewBox="300 140 760 1191"><image href="assets/ink-hand-source.png" width="1182" height="1331"/><path d="M616 250.2V280.4" stroke="#0248a6" stroke-width="13.9" stroke-linecap="round"/></svg>
        <div class="kicker"><svg viewBox="54.5 37 234.5 299" fill="none"><path d="M68.5 336V180C68.5 116 114 51 171.75 51C229.5 51 275 116 275 180V336" stroke="#1a1a18" stroke-width="28"/><path d="M132 66C112 88 105.5 104 105.5 124V202C105.5 233 135.2 257 171.75 257C208.3 257 238 233 238 202V124C238 104 231.5 88 211.5 66" stroke="#1a1a18" stroke-width="17.5"/><path d="M171.75 202.5V278.75" stroke="#0248a6" stroke-width="35" stroke-linecap="round"/></svg>Citizen Poll</div>
        <h2>I didn't just vote. I <em>asked.</em></h2>
        <ol class="asks"></ol>
        <div class="foot">
          <p class="line">The ink fades. The record doesn't.</p>
          Ballot ID<span class="mono">CP26-QR7KM-ZK5JQ-RVQ43-H8MK1</span>
        </div>
      </div>
      <figcaption><b>C · Poster</b>Editorial: a big headline, and the inked hand from the animation standing up in the corner as the illustration. The boldest and most "post-able" of the three; the asks get less room.</figcaption>
    </figure>
  </div>

<script>
  // Sample asks from your screenshot; current → target shortened for the card.
  const ASKS = [
    { t: "Raise public health spending from 1.9% to 3% of GDP", from: "1.9%", to: "3% of GDP", by: "Apr 2030" },
    { t: "Raise public education spending from 2.9% to 6% of GDP", from: "2.9%", to: "6% of GDP", by: "Mar 2029" },
    { t: "Publish MP attendance and voting records within 48 hours", from: "No deadline", to: "48 hours", by: "Aug 2027" },
  ];
  const tick = '<svg viewBox="0 0 12 12" fill="none"><path d="M2 6.5l2.6 2.5L10 3" stroke="#0248a6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const delta = (a) => `<span class="delta"><span class="from">${a.from}</span><span>→</span><span class="to">${a.to}</span><span style="color:var(--muted)">· by ${a.by}</span></span>`;
  document.querySelectorAll(".a .asks").forEach((ol) => ol.innerHTML = ASKS.map((a, i) => `<li><span class="n">${i + 1}</span><span class="t">${a.t}</span><span class="d">${delta(a)}</span></li>`).join(""));
  document.querySelectorAll(".b .asks").forEach((ol) => ol.innerHTML = ASKS.map((a) => `<li><span class="box">${tick}</span><span class="t">${a.t}</span><span class="d">${delta(a)}</span></li>`).join(""));
  document.querySelectorAll(".c .asks").forEach((ol) => ol.innerHTML = ASKS.map((a, i) => `<li><div class="n">ASK 0${i + 1}</div><div class="t">${a.t}</div><div class="d">${delta(a)}</div></li>`).join(""));
  // Barcode: bar widths drawn from the Ballot ID's characters, so each ballot's is its own.
  const id = "CP26QR7KMZK5JQRVQ43H8MK1";
  document.querySelector(".b .bars").innerHTML = [...id].flatMap((ch) => {
    const c = ch.charCodeAt(0);
    return [`<i style="width:${1 + (c % 3)}px"></i>`, `<i style="width:${1 + ((c >> 2) % 2)}px;opacity:${c % 2 ? 1 : .0}"></i>`];
  }).join("");
</script>
</body>
</html>
