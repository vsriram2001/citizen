<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ink Mark Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@600&display=swap" rel="stylesheet" />
<!--
  Standalone sandbox for the post-vote ink animation. Open this file directly
  in a browser; no app, no voting. Not wired into the vote flow yet.

  The idea: the logo is already on the voter's finger. Scaled so its arch
  matches the drawn finger (K below), the logo's nail lands within ~2px of the
  drawn nail and its line weights match the drawing's. So nothing morphs:
  the marker draws the logo's own capsule, and then the camera pushes in while
  the hand dissolves up to the logo's open bottom edge, and that is the logo.

  Art: docs/assets/ink-hand.png (hand line layer, index finger cut out above
  the knuckles; the finger is vector here, traced on the drawing's pixels)
  and docs/assets/ink-marker.png. Logo: src/components/nav/Logo.tsx.
-->
<style>
  :root {
    --headline: #33322e;
    --paper: #fafaf7;
    --brand: #0248a6;
    --border: #d9d7cf;
    --muted: #6f6f68;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--headline);
    font: 14px/1.4 system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
    gap: 16px;
  }
  .stage {
    width: min(100%, 360px);
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--paper);
    overflow: hidden;
  }
  svg { display: block; width: 100%; height: auto; }
  .controls { width: min(100%, 360px); display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button {
    font: inherit;
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 3px;
    background: #fff;
    color: var(--headline);
    cursor: pointer;
  }
  button[aria-pressed="true"] { background: var(--headline); color: var(--paper); border-color: var(--headline); }
  input[type="range"] { flex: 1; }
  .time { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 48px; text-align: right; }
</style>
</head>
<body>
  <div class="stage">
    <svg id="svg" viewBox="0 0 1182 1331" fill="none" aria-hidden="true">
      <defs>
        <!-- The capsule's shape, for the sheen to run inside. -->
        <clipPath id="capsuleClip"><rect id="capsuleRect" /></clipPath>
        <!-- Dissolves the hand from the wrist up; its edge stops at the logo's
             open bottom, so the finger never looks cut. -->
        <linearGradient id="wipeGrad" gradientUnits="userSpaceOnUse" x1="0" x2="0">
          <stop offset="0" stop-color="#fff" />
          <stop offset="1" stop-color="#fff" stop-opacity="0" />
        </linearGradient>
        <mask id="wipe" maskUnits="userSpaceOnUse" x="-1000" y="-1000" width="3200" height="3400">
          <rect x="-1000" y="-1000" width="3200" height="3400" fill="url(#wipeGrad)" />
        </mask>
      </defs>
      <g id="camera">
        <g id="body">
          <!-- Everything that isn't the logo: dissolves as the camera pushes in. -->
          <g id="hand" mask="url(#wipe)">
            <image href="assets/ink-hand.png" width="1182" height="1331" />
            <path d="M595 394Q616 384 638 395" stroke="var(--headline)" stroke-width="7" stroke-linecap="round" />
            <path id="legL" stroke="var(--headline)" stroke-width="10" stroke-linecap="round" />
            <path id="legR" stroke="var(--headline)" stroke-width="10" stroke-linecap="round" />
          </g>
          <!-- The fingertip, which is the logo. -->
          <g id="logo">
            <path id="outline" stroke="var(--headline)" />
            <path id="nail" stroke="var(--headline)" />
            <path id="ink" stroke="var(--brand)" stroke-linecap="round" />
            <rect id="sheen" fill="#fff" clip-path="url(#capsuleClip)" />
          </g>
        </g>
        <g id="marker"><image href="assets/ink-marker.png" width="1254" height="1254" /></g>
      </g>
      <text id="wordmark" x="591" text-anchor="middle" fill="var(--headline)"
        font-family="'Public Sans', system-ui, sans-serif" font-weight="600" font-size="78" letter-spacing="-1">Citizen Poll</text>
    </svg>
  </div>

  <div class="controls">
    <div class="row">
      <button id="play">Replay</button>
      <button id="loop" aria-pressed="false">Loop</button>
      <span style="flex:1"></span>
      <button data-speed="0.25">¼×</button>
      <button data-speed="0.5">½×</button>
      <button data-speed="1" aria-pressed="true">1×</button>
    </div>
    <div class="row">
      <input id="scrub" type="range" min="0" step="0.01" aria-label="Time" />
      <span id="time" class="time">0.00s</span>
    </div>
  </div>

<script>
// ─── The logo, placed on the drawn finger ──────────────────────────────────
// Logo coordinates (Logo.tsx) → the hand drawing's pixels. Its arch's
// centreline half-width (103.25) becomes the finger's (41).
const K = 41 / 103.25;
const LX = (x) => 616 + (x - 171.75) * K;
const LY = (y) => 190 + (y - 51) * K;
const map = (pts) => pts.map((v, i) => (i % 2 ? LY(v) : LX(v)));
const CUT_Y = LY(336); // the logo's open bottom: where the tip leaves the hand

// Each shape: [mx, my, then 6 numbers per cubic]; drawn and logo versions
// line up point for point. They differ by a pixel or two, which is the point.
const OUTLINE_DRAWN = [
  574.4, CUT_Y,
  574.6, 282.4, 574.8, 261.8, 575, 241.2,
  575, 215, 593, 190, 616, 190,
  639, 190, 657, 215, 657, 241.2,
  657.2, 261.8, 657.4, 282.4, 657.6, CUT_Y,
];
const OUTLINE_LOGO = map([
  68.5, 336,
  68.5, 284, 68.5, 232, 68.5, 180,
  68.5, 116, 114, 51, 171.75, 51,
  229.5, 51, 275, 116, 275, 180,
  275, 232, 275, 284, 275, 336,
]);
const NAIL_DRAWN = [
  600, 196,
  593, 203, 591, 209, 591, 216,
  591, 227, 591, 238, 591, 249,
  591, 260, 602, 269, 615.5, 269,
  629, 269, 640, 260, 640, 249,
  640, 238, 640, 227, 640, 216,
  640, 209, 638, 203, 631, 196,
];
const NAIL_LOGO = map([
  132, 66,
  112, 88, 105.5, 104, 105.5, 124,
  105.5, 150, 105.5, 176, 105.5, 202,
  105.5, 233, 135.2, 257, 171.75, 257,
  208.3, 257, 238, 233, 238, 202,
  238, 176, 238, 150, 238, 124,
  238, 104, 231.5, 88, 211.5, 66,
]);
// The ink is the logo's capsule from the first touch.
const INK = map([171.75, 202.5, 171.75, 278.75]);
const INK_W = 35 * K;
const W = { outline: [10, 28 * K], nail: [7, 17.5 * K] };
// The finger below the cut, which goes with the hand.
const LEG_L = `M574.4 ${CUT_Y}C573 376 571 449 569.5 522`;
const LEG_R = `M657.6 ${CUT_Y}C659.6 376 661.6 449 663.5 522`;

const MARKER_TIP = [285, 1003]; // nib tip in its own image
const MARKER_SCALE = 0.42;

// ─── Easing ────────────────────────────────────────────────────────────────
const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
const span = (t, a, b) => clamp01((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const outCubic = (p) => 1 - (1 - p) ** 3;
const outExpo = (p) => (p >= 1 ? 1 : 1 - 2 ** (-10 * p));
const inCubic = (p) => p ** 3;
const inOutCubic = (p) => (p < 0.5 ? 4 * p ** 3 : 1 - (-2 * p + 2) ** 3 / 2);
const inOutQuint = (p) => (p < 0.5 ? 16 * p ** 5 : 1 - (-2 * p + 2) ** 5 / 2);
const inOutSine = (p) => -(Math.cos(Math.PI * p) - 1) / 2;
const bump = (p) => Math.sin(Math.PI * p); // 0 → 1 → 0
// A damped spring from 0 to 1, for settles that feel physical.
const spring = (p) => (p <= 0 ? 0 : 1 - Math.exp(-7 * p) * Math.cos(11 * p));
const mix = (a, b, p) => a.map((v, i) => lerp(v, b[i], p));
function toD(a) {
  const r = (v) => Math.round(v * 100) / 100;
  let d = `M${r(a[0])} ${r(a[1])}`;
  for (let i = 2; i < a.length; i += 6)
    d += `C${r(a[i])} ${r(a[i + 1])} ${r(a[i + 2])} ${r(a[i + 3])} ${r(a[i + 4])} ${r(a[i + 5])}`;
  return d;
}
const quad = (a, c, b, p) => [
  (1 - p) ** 2 * a[0] + 2 * (1 - p) * p * c[0] + p * p * b[0],
  (1 - p) ** 2 * a[1] + 2 * (1 - p) * p * c[1] + p * p * b[1],
];

// ─── Timeline ──────────────────────────────────────────────────────────────
// 0.00–0.70 hand rises            0.10–1.05 camera drifts to the finger
// 0.45–0.92 marker arcs in        0.92–1.00 hovers, touches down
// 1.00–1.38 ink drawn             1.38–1.68 marker flicks away
// 1.45–1.90 the proud little tilt 1.80–2.60 hand dissolves upward to the logo
// 1.95–2.80 camera pushes in      2.40–2.85 a sheen runs down the wet ink
// 2.70–3.30 settle                3.00–3.50 wordmark
const DURATION = 3.7;
const VIEW = [1182, 1331];
const CAM = [
  { x: 591, y: 690, s: 1, sy: 665.5 },    // the whole hand
  { x: 616, y: 330, s: 2.6, sy: 665.5 },  // the finger, close enough to watch the ink go on
  { x: 616, y: LY(186), s: 4.6, sy: 560 }, // the logo, a little high to leave room for the name
];
const INK_TOP = [INK[0], INK[1]];
const INK_BOT = [INK[2], INK[3]];

function frameAt(t) {
  // Camera, scale eased in log space so a big push feels even.
  const c1 = inOutSine(span(t, 0.1, 1.05));
  const c2 = inOutQuint(span(t, 1.95, 2.8));
  const ls = (a, b, p) => Math.exp(lerp(Math.log(a), Math.log(b), p));
  const cx = lerp(lerp(CAM[0].x, CAM[1].x, c1), CAM[2].x, c2);
  const cy = lerp(lerp(CAM[0].y, CAM[1].y, c1), CAM[2].y, c2);
  const sy = lerp(lerp(CAM[0].sy, CAM[1].sy, c1), CAM[2].sy, c2);
  let s = ls(ls(CAM[0].s, CAM[1].s, c1), CAM[2].s, c2);
  // Settle: a small spring overshoot as the logo lands.
  const st = span(t, 2.7, 3.3);
  s *= 1 + 0.045 * (spring(st) - st ** 0.5) * (1 - st);

  // Hand rises; dips as the marker presses; tilts proudly once inked.
  const rise = outExpo(span(t, 0, 0.7));
  const press = 2.2 * bump(span(t, 0.96, 1.12)) + 1 * bump(span(t, 1.36, 1.5));
  const tilt = -1.3 * bump(span(t, 1.45, 1.9));

  // The hand dissolves upward, from below the frame to the logo's open
  // bottom, while the camera pushes in. The feather keeps the edge soft.
  // Until the push the edge sits at the frame's bottom, only softening the wrist.
  const wipe = span(t, 1.8, 2.6);
  const wipeEdge = wipe > 0 ? lerp(706, CUT_Y, inOutSine(wipe)) : 1331;
  const FEATHER = wipe > 0 ? 120 : 260;

  // The drawn finger tightens into the exact logo during the push.
  const m = inOutCubic(span(t, 2.0, 2.6));

  // Ink.
  const draw = inOutSine(span(t, 1.0, 1.38));
  const front = [INK_TOP[0], lerp(INK_TOP[1], INK_BOT[1], draw)];
  const sheenP = span(t, 2.4, 2.85);

  // Marker: arcs in from the top right, hovers, presses, draws, flicks off.
  let tip, rot, mo;
  const hover = [INK_TOP[0] + 4, INK_TOP[1] - 16];
  if (t < 0.92) {
    const p = outCubic(span(t, 0.45, 0.92));
    tip = quad([1060, -180], [980, 260], hover, p);
    rot = lerp(14, 2, p);
    mo = span(t, 0.45, 0.6);
  } else if (t < 1.0) {
    const p = inOutSine(span(t, 0.92, 1.0));
    tip = [lerp(hover[0], INK_TOP[0], p), lerp(hover[1], INK_TOP[1], p)];
    rot = lerp(2, 0, p);
    mo = 1;
  } else if (t < 1.38) {
    tip = [front[0], front[1] + press];
    rot = lerp(0, -4, draw);
    mo = 1;
  } else {
    const p = span(t, 1.38, 1.68);
    tip = quad(INK_BOT, [700, 250], [1080, -160], inCubic(p) * 0.85 + p * 0.15);
    rot = lerp(-4, 16, outCubic(p));
    mo = 1 - span(t, 1.55, 1.68);
  }

  const pivot = "616 1250";
  const sheenY = lerp(LY(202.5) - 40, LY(278.75) + 30, inOutSine(sheenP));
  return {
    camera: { transform: `translate(${VIEW[0] / 2} ${sy.toFixed(2)}) scale(${s.toFixed(4)}) translate(${-cx.toFixed(2)} ${-cy.toFixed(2)})` },
    body: {
      transform: `translate(0 ${(lerp(110, 0, rise) + press).toFixed(2)}) rotate(${tilt.toFixed(3)} ${pivot})`,
      opacity: span(t, 0, 0.35),
    },
    wipeGrad: { y1: (wipeEdge - FEATHER).toFixed(2), y2: wipeEdge.toFixed(2) },
    legL: { d: LEG_L },
    legR: { d: LEG_R },
    outline: { d: toD(mix(OUTLINE_DRAWN, OUTLINE_LOGO, m)), "stroke-width": lerp(W.outline[0], W.outline[1], m) },
    nail: { d: toD(mix(NAIL_DRAWN, NAIL_LOGO, m)), "stroke-width": lerp(W.nail[0], W.nail[1], m) },
    ink: {
      d: `M${INK_TOP[0]} ${INK_TOP[1]}L${front[0]} ${front[1]}`,
      "stroke-width": INK_W,
      opacity: draw > 0 ? 1 : 0,
    },
    capsuleRect: {
      x: INK_TOP[0] - INK_W / 2, y: INK_TOP[1] - INK_W / 2,
      width: INK_W, height: INK_BOT[1] - INK_TOP[1] + INK_W, rx: INK_W / 2,
    },
    sheen: {
      x: INK_TOP[0] - INK_W, y: sheenY.toFixed(2), width: INK_W * 2, height: 9,
      opacity: sheenP > 0 && sheenP < 1 ? 0.55 * bump(sheenP) : 0,
      transform: `rotate(-24 ${INK_TOP[0]} ${sheenY.toFixed(2)})`,
    },
    marker: {
      transform: `translate(${tip[0].toFixed(2)} ${tip[1].toFixed(2)}) rotate(${rot.toFixed(2)}) scale(${MARKER_SCALE}) translate(${-MARKER_TIP[0]} ${-MARKER_TIP[1]})`,
      opacity: mo,
    },
    wordmark: {
      y: (1010 + 18 * (1 - outCubic(span(t, 3.0, 3.5)))).toFixed(2),
      opacity: outCubic(span(t, 3.0, 3.5)),
    },
  };
}

// ─── Render + controls ─────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
function apply(t) {
  const f = frameAt(t);
  for (const key in f) for (const [k, v] of Object.entries(f[key])) $(key).setAttribute(k, v);
  $("scrub").value = t;
  $("time").textContent = `${t.toFixed(2)}s`;
}

const END_HOLD = 1.4; // pause on the logo before a loop restarts
let speed = 1, looping = false, raf = 0, start = 0;
$("scrub").max = DURATION;

function play() {
  cancelAnimationFrame(raf);
  start = performance.now();
  const tick = (now) => {
    const t = ((now - start) / 1000) * speed;
    if (t < DURATION) { apply(t); raf = requestAnimationFrame(tick); return; }
    apply(DURATION);
    if (looping && t >= DURATION + END_HOLD) { start = now; apply(0); }
    if (looping) raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
}

$("play").onclick = play;
$("loop").onclick = (e) => {
  looping = !looping;
  e.currentTarget.setAttribute("aria-pressed", looping);
  if (looping) play();
};
document.querySelectorAll("[data-speed]").forEach((b) =>
  b.addEventListener("click", () => {
    speed = Number(b.dataset.speed);
    document.querySelectorAll("[data-speed]").forEach((x) => x.setAttribute("aria-pressed", x === b));
    play();
  })
);
$("scrub").addEventListener("input", (e) => {
  cancelAnimationFrame(raf);
  apply(Number(e.target.value));
});

// Start once the drawings and the font are in, so nothing plays half-loaded.
apply(0);
Promise.all([
  ...["assets/ink-hand.png", "assets/ink-marker.png"].map(
    (src) => new Promise((ok) => { const i = new Image(); i.onload = i.onerror = ok; i.src = src; })
  ),
  document.fonts ? document.fonts.ready : Promise.resolve(),
]).then(() => { apply(0); play(); });
</script>
</body>
</html>
